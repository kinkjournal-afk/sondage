<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résultats — admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Résultats des sondages</h1>
  <p class="muted">Page réservée à l'administrateur. Ne partage pas ce lien.</p>

  <div class="card">
    <div class="field">
      <label for="worker">URL du Worker</label>
      <input type="text" id="worker" value="https://sondage-worker.kink-journal.workers.dev">
    </div>
    <div class="field">
      <label for="survey">Sondage</label>
      <select id="survey">
        <option value="sexualite">Sexualité masculine</option>
        <option value="bdsm">Cages & jouets</option>
      </select>
    </div>
    <div class="field">
      <label for="key">Clé admin (ADMIN_KEY)</label>
      <input type="text" id="key" placeholder="colle ta clé ici">
    </div>
    <button id="loadBtn">Charger les résultats</button>
    <p class="error-message" id="error"></p>
  </div>

  <div class="results-toolbar">
    <span class="count" id="count"></span>
  </div>

  <div class="results-wrap">
    <table class="results" id="results"></table>
  </div>
</main>

<script>
  const loadBtn = document.getElementById("loadBtn");
  const errorBox = document.getElementById("error");
  const countBox = document.getElementById("count");
  const table = document.getElementById("results");
  const surveySelect = document.getElementById("survey");

  const ENUM_LABELS = {
    "-1": "Pas de réponse",
    "0": "Oui",
    "1": "Non",
  };
  const ENUM_COLUMNS = new Set(["nude", "rase", "circ", "amour", "soumis", "dom", "NNN"]);

  const COLUMN_LABELS = {
    age: "Âge",
    porno: "Porno /sem",
    nb_mast: "Masturbation /sem",
    nude: "A envoyé un nude",
    rase: "Se rase",
    circ: "Circoncis",
    taille_repos: "Taille au repos (cm)",
    taille: "Taille en érection (cm)",
    amour: "A eu un rapport",
    age_amour: "Âge première fois",
    orient: "Orientation",
    soumis: "Soumis",
    dom: "Dominant",
    NNN: "A fait NNN",
    NNN_resultat: "Jours tenus NNN",
    comm: "Commentaire",
    submitted_at: "Envoyé le",
    cage: "Cage de chasteté",
    cage_duree: "Depuis quand",
    frequence: "Fréquence de port",
    record_jours: "Record (jours)",
    avec_partenaire: "Configuration",
    jouets: "Autres jouets",
    decouverte: "Découverte via",
    role: "Rôle",
    ressenti: "Ressenti principal",
  };

  const BDSM_LABELS = {
    cage: { "0": "Oui", "1": "Non", "2": "Intéressé", "3": "Pas intéressé" },
    frequence: { occasionnel: "Occasionnel", regulier: "Régulier", quasi_permanent: "Quasi permanent" },
    avec_partenaire: { "-1": "Pas de réponse", "0": "Seul", "1": "Partenaire a la clé", "2": "Autre", "3": "Dom à distance" },
    role: { soumis: "Soumis", dominant: "Dominant", switch: "Switch", non_reponse: "Pas de réponse" },
  };

  function formatValue(col, value) {
    if (value === null || value === undefined || value === "") return "—";
    if (ENUM_COLUMNS.has(col)) {
      const label = ENUM_LABELS[String(value)];
      if (label) return label;
    }
    if (BDSM_LABELS[col]) {
      const label = BDSM_LABELS[col][String(value)];
      if (label) return label;
    }
    if (col === "submitted_at") {
      const d = new Date(value);
      if (!isNaN(d)) return d.toLocaleString("fr-FR");
    }
    return value;
  }

  loadBtn.addEventListener("click", async () => {
    errorBox.textContent = "";
    table.innerHTML = "";
    countBox.textContent = "";

    const worker = document.getElementById("worker").value.trim().replace(/\/$/, "");
    const key = document.getElementById("key").value.trim();
    const survey = surveySelect.value;

    if (!worker || !key) {
      errorBox.textContent = "Renseigne l'URL du Worker et la clé admin.";
      return;
    }

    loadBtn.disabled = true;
    loadBtn.textContent = "Chargement…";

    try {
      const res = await fetch(worker + "/export/" + survey, {
        headers: { "Authorization": "Bearer " + key }
      });

      if (res.status === 401) throw new Error("Clé admin incorrecte.");
      if (!res.ok) throw new Error("Erreur serveur (" + res.status + ")");

      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        countBox.textContent = "Aucune réponse pour le moment.";
        return;
      }

      countBox.textContent = data.length + " réponse(s)";

      const columns = Object.keys(data[0]).filter(c => c !== "_id");

      const thead = document.createElement("thead");
      const theadRow = document.createElement("tr");
      columns.forEach(col => {
        const th = document.createElement("th");
        th.textContent = COLUMN_LABELS[col] || col;
        theadRow.appendChild(th);
      });
      const thAction = document.createElement("th");
      theadRow.appendChild(thAction);
      thead.appendChild(theadRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.dataset.id = row._id;
        columns.forEach(col => {
          const td = document.createElement("td");
          td.textContent = formatValue(col, row[col]);
          tr.appendChild(td);
        });

        const tdAction = document.createElement("td");
        tdAction.className = "actions";
        const delBtn = document.createElement("button");
        delBtn.textContent = "Supprimer";
        delBtn.className = "btn-delete";
        delBtn.addEventListener("click", () => deleteResponse(survey, row._id, tr));
        tdAction.appendChild(delBtn);
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    } catch (err) {
      errorBox.textContent = err.message;
    } finally {
      loadBtn.disabled = false;
      loadBtn.textContent = "Charger les résultats";
    }
  });

  async function deleteResponse(survey, id, rowEl) {
    if (!confirm("Supprimer définitivement cette réponse ?")) return;

    const worker = document.getElementById("worker").value.trim().replace(/\/$/, "");
    const key = document.getElementById("key").value.trim();

    try {
      const res = await fetch(worker + "/response/" + survey + "/" + id, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + key }
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Échec de la suppression");
      }
      rowEl.remove();
      const remaining = table.querySelectorAll("tbody tr").length;
      countBox.textContent = remaining + " réponse(s)";
    } catch (err) {
      alert(err.message);
    }
  }
</script>
</body>
</html>
