<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résultats — admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Résultats du sondage</h1>
  <p class="muted">Page réservée à l'administrateur. Ne partage pas ce lien.</p>

  <div class="card">
    <div class="field">
      <label for="worker">URL du Worker</label>
      <input type="text" id="worker" value="https://sondage-worker.kink-journal.workers.dev">
    </div>
    <div class="field">
      <label for="key">Clé admin (ADMIN_KEY)</label>
      <input type="text" id="key" placeholder="colle ta clé ici">
    </div>
    <button id="loadBtn">Charger les résultats</button>
    <p class="error-message" id="error"></p>
  </div>

  <p id="count" class="muted"></p>

  <div style="overflow-x:auto;">
    <table id="results" style="width:100%; border-collapse: collapse; font-size: 0.85rem;"></table>
  </div>
</main>

<script>
  const loadBtn = document.getElementById("loadBtn");
  const errorBox = document.getElementById("error");
  const countBox = document.getElementById("count");
  const table = document.getElementById("results");

  // Colonnes dont les valeurs -1/0/1 doivent être traduites.
  const ENUM_LABELS = {
    "-1": "Pas de réponse",
    "0": "Oui",
    "1": "Non",
  };
  const ENUM_COLUMNS = new Set(["nude", "rase", "circ", "amour", "soumis", "dom", "NNN"]);

  // Noms de colonnes plus lisibles à l'affichage.
  const COLUMN_LABELS = {
    age: "Âge",
    porno: "Porno /sem",
    nb_mast: "Masturbation /sem",
    nude: "A envoyé un nude",
    rase: "Se rase",
    circ: "Circoncis",
    taille_repos: "Taille au repos (cm)",
    taille: "Taille en érection (cm)",
    amour: "A eu un rapport",
    age_amour: "Âge première fois",
    orient: "Orientation",
    soumis: "Soumis",
    dom: "Dominant",
    NNN: "A fait NNN",
    NNN_resultat: "Jours tenus NNN",
    comm: "Commentaire",
    submitted_at: "Envoyé le",
  };

  function formatValue(col, value) {
    if (value === null || value === undefined || value === "") return "";
    if (ENUM_COLUMNS.has(col)) {
      const label = ENUM_LABELS[String(value)];
      if (label) return label;
    }
    if (col === "submitted_at") {
      const d = new Date(value);
      if (!isNaN(d)) return d.toLocaleString("fr-FR");
    }
    return value;
  }

  loadBtn.addEventListener("click", async () => {
    errorBox.textContent = "";
    table.innerHTML = "";
    countBox.textContent = "";

    const worker = document.getElementById("worker").value.trim().replace(/\/$/, "");
    const key = document.getElementById("key").value.trim();

    if (!worker || !key) {
      errorBox.textContent = "Renseigne l'URL du Worker et la clé admin.";
      return;
    }

    loadBtn.disabled = true;
    loadBtn.textContent = "Chargement…";

    try {
      const res = await fetch(worker + "/export", {
        headers: { "Authorization": "Bearer " + key }
      });

      if (res.status === 401) throw new Error("Clé admin incorrecte.");
      if (!res.ok) throw new Error("Erreur serveur (" + res.status + ")");

      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        countBox.textContent = "Aucune réponse pour le moment.";
        return;
      }

      countBox.textContent = data.length + " réponse(s)";

      const columns = Object.keys(data[0]).filter(c => c !== "_id");
      const thead = document.createElement("tr");
      columns.forEach(col => {
        const th = document.createElement("th");
        th.textContent = COLUMN_LABELS[col] || col;
        th.style.cssText = "border:1px solid #d9d7d1; padding:6px 8px; background:#efedea; text-align:left; position:sticky; top:0;";
        thead.appendChild(th);
      });
      const thAction = document.createElement("th");
      thAction.textContent = "";
      thAction.style.cssText = "border:1px solid #d9d7d1; padding:6px 8px; background:#efedea; position:sticky; top:0;";
      thead.appendChild(thAction);
      table.appendChild(thead);

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.dataset.id = row._id;
        columns.forEach(col => {
          const td = document.createElement("td");
          td.textContent = formatValue(col, row[col]);
          td.style.cssText = "border:1px solid #d9d7d1; padding:6px 8px; white-space:nowrap;";
          tr.appendChild(td);
        });

        const tdAction = document.createElement("td");
        tdAction.style.cssText = "border:1px solid #d9d7d1; padding:6px 8px;";
        const delBtn = document.createElement("button");
        delBtn.textContent = "Supprimer";
        delBtn.style.cssText = "background:#a4292b; padding:0.3rem 0.7rem; font-size:0.8rem;";
        delBtn.addEventListener("click", () => deleteResponse(row._id, tr));
        tdAction.appendChild(delBtn);
        tr.appendChild(tdAction);

        table.appendChild(tr);
      });
    } catch (err) {
      errorBox.textContent = err.message;
    } finally {
      loadBtn.disabled = false;
      loadBtn.textContent = "Charger les résultats";
    }
  });

  async function deleteResponse(id, rowEl) {
    if (!confirm("Supprimer définitivement cette réponse ?")) return;

    const worker = document.getElementById("worker").value.trim().replace(/\/$/, "");
    const key = document.getElementById("key").value.trim();

    try {
      const res = await fetch(worker + "/response/" + id, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + key }
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Échec de la suppression");
      }
      rowEl.remove();
      countBox.textContent = table.rows.length - 1 + " réponse(s)";
    } catch (err) {
      alert(err.message);
    }
  }
</script>
</body>
</html>
